name: uids

services:
  # The service name is the hostname the VPS's Caddy proxies to, and that name
  # is shared with every other stack on the `proxy` network — hence the prefix
  # rather than a bare `storybook`.
  uids-storybook:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in .env}/uids-storybook:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # No `ports` block on purpose. Caddy runs in Docker here, so it reaches this
    # container over the shared network by name — publishing a host port would
    # only widen the surface without being used.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - proxy

networks:
  # Created outside this stack — it is the network Caddy already sits on.
  proxy:
    external: true
