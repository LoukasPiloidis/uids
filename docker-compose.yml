name: uids

services:
  storybook:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in .env}/uids-storybook:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Bound to loopback only: the VPS's existing Caddy terminates TLS for
    # uids.piloidis.com and proxies to this port. Nothing is exposed publicly
    # by this container itself.
    #
    # If that Caddy runs inside Docker too, loopback won't reach it. In that
    # case drop the `ports` block, uncomment `networks` below, and proxy to
    # `storybook:80` by service name instead.
    ports:
      - "127.0.0.1:${STORYBOOK_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # networks:
    #   - proxy

# networks:
#   proxy:
#     external: true
